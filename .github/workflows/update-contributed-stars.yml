name: Update Contributed Stars

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'scripts/update_contributed_stars.py'
      - '.github/workflows/update-contributed-stars.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate contributed stars card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_contributed_stars.py --username PPPP-kaqiu --svg assets/contributed-stars.svg

      - name: Commit and push updates
        run: |
          if git diff --quiet -- README.md assets/contributed-stars.svg; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contributed-stars.svg
          git commit -m "chore: update contributed stars"
          git push
